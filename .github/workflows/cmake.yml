name: CMake

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        openblas: ["OFF", "ON"]

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake libboost-dev libboost-random-dev libopenblas-dev swig python3-dev python3-numpy

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DSIMANNEAL_ENABLE_OPENBLAS=${{matrix.openblas}} -DSIMANNEAL_ENABLE_LTO=${{ matrix.os == 'ubuntu-22.04' && matrix.openblas == 'ON' && 'ON' || 'OFF' }}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

    - name: Build and test Python profiles
      if: matrix.os == 'ubuntu-22.04' && matrix.openblas == 'ON'
      run: |
        cmake -S . -B build-python -DSKBUILD=ON -DCMAKE_BUILD_TYPE=Release -DSIMANNEAL_ENABLE_OPENBLAS=ON -DSIMANNEAL_ENABLE_LTO=ON
        cmake --build build-python --parallel 2
        python3 tests/wrapper_profiles.py build-python
        python3 tests/batch_interface.py build-python

    - name: Test benchmark safeguards with and without Python optimization
      if: matrix.os == 'ubuntu-22.04' && matrix.openblas == 'ON'
      run: |
        /usr/bin/python3 tests/benchmark_guards.py
        /usr/bin/python3 -O tests/benchmark_guards.py
